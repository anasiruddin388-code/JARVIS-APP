name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev libltdl-dev
      - name: Install buildozer
        run: pip install buildozer "cython<3"
      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
      - name: Build APK
        shell: bash
        run: |
          for i in 1 2 3 4; do
            buildozer -v android debug 2>&1 | tee -a build.log
            if ls bin/*.apk >/dev/null 2>&1; then exit 0; fi
            echo "Build failed, retry $i after 90 seconds" | tee -a build.log
            sleep 90
          done
          exit 1
      - name: Save log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: bin/*.apk
